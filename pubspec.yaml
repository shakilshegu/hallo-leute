name: poppylo
description: A gamified German learning app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10
  google_fonts: ^8.2.1
  app_links: ^7.2.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon_legacy.png"
  adaptive_icon_background: "#1E4034"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1E4034"
