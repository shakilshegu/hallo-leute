name: hallo_leute
description: "Hallo Leute – German vocabulary made simple for nurses and IT professionals moving to Germany."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  sentry_flutter: ^10.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/vocabulary/
    - assets/licenses/

  # Variable fonts (OFL). Weight is applied via FontVariation('wght', …),
  # see lib/theme/app_text.dart.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

# App icon: regenerate with `dart run flutter_launcher_icons`
# (source PNGs come from tool/icon/generate_icon_test.dart).
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: true
  adaptive_icon_background: "#13294B"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#13294B"
    theme_color: "#13294B"

# Launch screen: regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#13294B"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#13294B"
    image: assets/brand/app_icon_foreground.png
    icon_background_color: "#13294B"
  web: true
